; VestaLaunch skin: the Skin folder next to VestaLaunch.exe. Read once at start.
; [colors]: RRGGBB. [images]: PNG files in this folder, transparency supported.
; Icons are square and drawn scaled, in the colour of their place unless it is the text colour.
; Optional: <name>_down = a separate pressed picture (otherwise the icon is tinted dark),
;   background = an 800 x 480 picture instead of the built-in mosaic.
; Each picture costs memory: a 64 x 64 icon 16 KB, the background 750 KB.
; A missing line or file falls back to the built-in drawing.

[colors]
ink     = 0B0C0E   ; background
panel   = 17191C   ; tiles, buttons, widgets
line    = 34383F   ; borders
text    = F3F1EC   ; main text, built-in icons
muted   = A3A8B0   ; secondary text
dim     = 5D636C   ; inactive text
accent  = FF6B1A   ; pressed button, active mode, headings
facet   = C24A0B   ; tile corner
mosaic1 = 0E0F12   ; built-in background triangles (unused with a background picture)
mosaic2 = 14161A
mosaic3 = 17191D

[images]
prev = prev.png
next = next.png
edit = edit.png
add = add.png
folder = folder.png
file = file.png
up = up.png
shift = shift.png
backspace = backspace.png
